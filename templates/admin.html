{% extends "base.html" %}{% block content %}<div class="page"><h1>Admin Dashboard</h1><div class="stats"><div>Orders <b>{{orders|length}}</b></div><div>Status <b>Lab</b></div></div><table><tr><th>ID</th><th>User</th><th>Total</th><th>Status</th></tr>{% for o in orders %}<tr><td>{{o.id}}</td><td>{{o.username}}</td><td>₹{{"%.0f"|format(o.total)}}</td><td>{{o.status}}</td></tr>{% endfor %}</table></div>{% endblock %}
