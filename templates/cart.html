{% extends "base.html" %}{% block content %}<div class="page"><h1>Your Cart</h1>{% for p in products %}<div class="cartrow"><span>{{p.image}} {{p.name}}</span><b>₹{{"%.0f"|format(p.price)}}</b></div>{% else %}<p>Your cart is empty.</p>{% endfor %}<h2>Total: ₹{{"%.0f"|format(total)}}</h2>{% if products %}<a class="btn" href="/checkout">Checkout</a>{% endif %}</div>{% endblock %}
