{% extends "base.html" %}{% block content %}<div class="page"><form class="searchbar" action="/search"><input name="q" value="{{q}}" placeholder="Search products..."><button class="btn">Search</button></form><h2>Results</h2><main class="grid">{% for p in products %}<article class="card"><div class="emoji">{{p.image}}</div><h3>{{p.name}}</h3><b>₹{{"%.0f"|format(p.price)}}</b></article>{% else %}<p>No products found.</p>{% endfor %}</main></div>{% endblock %}
