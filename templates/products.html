{% extends "base.html" %}{% block content %}<div class="page"><h1>Products</h1><div class="filters">{% for c in categories %}<a class="{% if selected==c.category %}active{% endif %}" href="/products?category={{c.category}}">{{c.category}}</a>{% endfor %}<a href="/products">All</a></div><main class="grid">{% for p in products %}<article class="card"><div class="emoji">{{p.image}}</div><small>{{p.category}} · {{p.stock}} in stock</small><h3>{{p.name}}</h3><p>{{p.description}}</p><b>₹{{"%.0f"|format(p.price)}}</b><div><a class="btn small" href="/product/{{p.id}}">Details</a><a class="btn small outline" href="/cart/add/{{p.id}}">Add</a></div></article>{% endfor %}</main></div>{% endblock %}
